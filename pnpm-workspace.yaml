packages:
  - apps/*
  - packages/*

auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg (brace-expansion OOM DoS). Unfixable + unreachable: the only remaining path
    # is eslint's minimatch@3 (pinned minimatch@^3 by @eslint/config-array + @eslint/eslintrc), which
    # requires the v1 callable API. brace-expansion's newest 1.x is 1.1.16 (no 1.x patch exists) and
    # the fix (>=5.0.8) is a v5 named export that crashes minimatch@3. It runs at build time over our
    # own eslint config globs and repo file paths (no attacker input). The v5 edge (minimatch@10) is
    # patched to 5.0.8 via overrides; only this build-only v1 edge is waived.
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  # Unused: apps/app uses libSQL (prebuilt). better-sqlite3 lingers only as a Better Auth
  # optional peer; never build its native binary (it fails under Node 24 and we don't load it).
  # @sentry/cli downloads a binary for source-map upload. We run Sentry server-side only with no
  # upload (no withSentryConfig), so its postinstall is unused.
  '@sentry/cli': false
  better-sqlite3: false
  esbuild: true
  sharp: true
  # Pulled in by @scalar/api-client-react (OpenAPI playground). Its postinstall only
  # selects a Vue build; the React client does not need it.
  vue-demi: false

minimumReleaseAgeExclude:
  - fumadocs-core@16.10.5
  - fumadocs-openapi@11.0.3
  - fumadocs-ui@16.10.5

# Pin transitive deps to patched versions (pnpm audit advisories).
overrides:
  # Bare keys (force every instance) with a major cap, since ranged selectors match the declared
  # spec, not the resolved version, and leave transitive copies un-bumped. brace-expansion has two
  # legitimate majors in the tree, so it uses per-major selectors instead of a collapsing bare key.
  # GHSA-r28c-9q8g-f849: postcss <8.5.18 source-map path traversal.
  postcss: ">=8.5.18 <9"
  # GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg: brace-expansion DoS. Bump per-major: v1 must stay v1
  # because minimatch 3.x calls it as `module.exports = expand` (v5 changed to a named export and
  # crashes minimatch 3.x). A resolved-version range catches the stubborn v5 minimatch edge that the
  # bare `@5` selector missed. Build-time glob only, off the runtime path.
  brace-expansion@1: ">=1.1.16 <2"
  brace-expansion@5: ">=5.0.8 <6"
  # GHSA-52cp-r559-cp3m: js-yaml <4.3.0 quadratic CPU via merge-key chains.
  js-yaml: ">=4.3.0 <5"
  # GHSA-395f-4hp3-45gv: shell-quote <=1.8.4 quadratic-complexity DoS in parse().
  shell-quote: ">=1.8.5 <2"
  # GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6: fast-uri <3.1.4 host confusion.
  fast-uri: ">=3.1.4 <4"
  # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 inherited libvips CVEs.
  sharp: ">=0.35.0 <0.36"
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  # GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 dev-server CORS. Reaches us only via the deprecated
  # @esbuild-kit loader (drizzle-kit config load, no dev server), so unreachable in practice;
  # bump anyway to clear the advisory.
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-gpj5-g38j-94v9: drizzle-orm <0.45.2 SQL identifier-injection (reachable via auth DB).
  drizzle-orm@<0.45.2: ">=0.45.2"

# apps/worker is Python (uv-managed) and has no package.json. pnpm skips it.
