packages:
  - apps/*
  - packages/*

allowBuilds:
  # Unused: apps/app uses libSQL (prebuilt). better-sqlite3 lingers only as a Better Auth
  # optional peer; never build its native binary (it fails under Node 24 and we don't load it).
  # @sentry/cli downloads a binary for source-map upload. We run Sentry server-side only with no
  # upload (no withSentryConfig), so its postinstall is unused.
  '@sentry/cli': false
  better-sqlite3: false
  esbuild: true
  sharp: true
  # Pulled in by @scalar/api-client-react (OpenAPI playground). Its postinstall only
  # selects a Vue build; the React client does not need it.
  vue-demi: false

minimumReleaseAgeExclude:
  - fumadocs-core@16.10.5
  - fumadocs-openapi@11.0.3
  - fumadocs-ui@16.10.5

# Pin transitive deps to patched versions (pnpm audit advisories).
overrides:
  # Bare keys (force every instance) with a major cap, since ranged selectors match the declared
  # spec, not the resolved version, and leave transitive copies un-bumped. brace-expansion has two
  # legitimate majors in the tree, so it uses per-major selectors instead of a collapsing bare key.
  # GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp: postcss <8.5.23 source-map path traversal
  # (second GHSA is an incomplete-fix follow-up on the first).
  postcss: ">=8.5.23 <9"
  # GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895: brace-expansion DoS. Bump
  # per-major: v1 must stay v1 because minimatch 3.x calls it as `module.exports = expand` (v5
  # changed to a named export and crashes minimatch 3.x). A resolved-version range catches the
  # stubborn v5 minimatch edge that the bare `@5` selector missed. Build-time glob only, off the
  # runtime path. A 1.x patch (1.1.18) now exists, so both majors are fixable in place.
  brace-expansion@1: ">=1.1.18 <2"
  brace-expansion@5: ">=5.0.9 <6"
  # GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj: js-yaml <4.3.1 quadratic CPU (merge-key chains,
  # then a !!omap follow-up).
  js-yaml: ">=4.3.1 <5"
  # GHSA-395f-4hp3-45gv: shell-quote <=1.8.4 quadratic-complexity DoS in parse().
  shell-quote: ">=1.8.5 <2"
  # GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6 / GHSA-7p8r-x3mc-p8w7: fast-uri <3.1.5 host
  # confusion (backslash authority introducer is the latest variant).
  fast-uri: ">=3.1.5 <4"
  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv: nanoid infinite loop on size 0 / negative size.
  # Two majors in the tree (Next.js pulls v5, older transitives pull v3).
  nanoid@3: ">=3.3.18 <4"
  nanoid@5: ">=5.1.16 <6"
  # GHSA-4cwx-7wf7-3272 (+4 related undici advisories): cache/cookie/CRLF-injection and
  # response-desync issues, all fixed together at 7.29.0. Reaches us via vitest>jsdom's fetch
  # polyfill (test-only), not a runtime dependency.
  undici: ">=7.29.0 <8"
  # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 inherited libvips CVEs.
  sharp: ">=0.35.0 <0.36"
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: browserslist <=4.28.6 unbounded query cache OOM +
  # prototype write via untrusted custom stats. Build-time only (babel/webpack targets), never on
  # the runtime path.
  browserslist: ">=4.28.7 <5"
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  # GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 dev-server CORS. Reaches us only via the deprecated
  # @esbuild-kit loader (drizzle-kit config load, no dev server), so unreachable in practice;
  # bump anyway to clear the advisory.
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-gpj5-g38j-94v9: drizzle-orm <0.45.2 SQL identifier-injection (reachable via auth DB).
  drizzle-orm@<0.45.2: ">=0.45.2"

# apps/worker is Python (uv-managed) and has no package.json. pnpm skips it.
